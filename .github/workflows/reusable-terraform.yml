name: 'Reusable: Terraform Workflow'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, staging, production)'
        required: true
        type: string
      action:
        description: 'Terraform action (plan or apply)'
        required: true
        type: string
      working_directory:
        description: 'Working directory for Terraform'
        required: false
        type: string
        default: './infrastructure'
      terraform_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: '1.6.0'
      auto_approve:
        description: 'Auto-approve Terraform apply'
        required: false
        type: boolean
        default: false
    
    outputs:
      app_service_name:
        description: 'Name of the deployed App Service'
        value: ${{ jobs.terraform.outputs.app_service_name }}
      app_service_url:
        description: 'URL of the deployed App Service'
        value: ${{ jobs.terraform.outputs.app_service_url }}
      key_vault_name:
        description: 'Name of the deployed Key Vault'
        value: ${{ jobs.terraform.outputs.key_vault_name }}

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    outputs:
      app_service_name: ${{ steps.outputs.outputs.app_service_name }}
      app_service_url: ${{ steps.outputs.outputs.app_service_url }}
      key_vault_name: ${{ steps.outputs.outputs.key_vault_name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: ${{ inputs.action == 'plan' }}
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ inputs.environment }}.tfstate"
        working-directory: ${{ inputs.working_directory }}
      
      - name: Terraform Validate
        if: inputs.action == 'plan'
        run: terraform validate
        working-directory: ${{ inputs.working_directory }}
      
      - name: Terraform Plan
        if: inputs.action == 'plan'
        id: plan
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.txt
        working-directory: ${{ inputs.working_directory }}
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      
      - name: Upload Plan Artifact
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 30
      
      - name: Download Plan Artifact
        if: inputs.action == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/
      
      - name: Terraform Apply
        if: inputs.action == 'apply'
        id: apply
        run: |
          terraform apply ${{ inputs.auto_approve && '-auto-approve' || '' }} tfplan
        working-directory: ${{ inputs.working_directory }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      
      - name: Get Terraform Outputs
        if: inputs.action == 'apply'
        id: outputs
        run: |
          echo "app_service_name=$(terraform output -raw app_service_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "app_service_url=$(terraform output -raw app_service_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "key_vault_name=$(terraform output -raw key_vault_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true
      
      - name: Create Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const action = '${{ inputs.action }}';
            const environment = '${{ inputs.environment }}';
            const status = '${{ job.status }}';
            
            let summary = `## Terraform ${action} - ${environment}\n\n`;
            summary += `**Status:** ${status === 'success' ? '✅' : '❌'} ${status}\n\n`;
            
            if (action === 'apply' && status === 'success') {
              summary += `### Outputs\n`;
              summary += `- App Service: \`${{ steps.outputs.outputs.app_service_name }}\`\n`;
              summary += `- App URL: ${{ steps.outputs.outputs.app_service_url }}\n`;
              summary += `- Key Vault: \`${{ steps.outputs.outputs.key_vault_name }}\`\n`;
            }
            
            core.summary.addRaw(summary).write();
