name: Infrastructure - Deploy to Dev

on:
  push:
    branches: [develop]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra-*.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TERRAFORM_VERSION: '1.6.0'
  AZURE_REGION: 'eastus'
  ENVIRONMENT: 'dev'

jobs:
  terraform_plan:
    name: Terraform Plan - Dev
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ env.ENVIRONMENT }}.tfstate"
        working-directory: ./infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infrastructure
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        working-directory: ./infrastructure
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/tfplan
          retention-days: 5

  terraform_apply:
    name: Terraform Apply - Dev
    runs-on: ubuntu-latest
    needs: terraform_plan
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/
      
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ env.ENVIRONMENT }}.tfstate"
        working-directory: ./infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      
      - name: Get Terraform Outputs
        id: outputs
        run: |
          echo "app_service_name=$(terraform output -raw app_service_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "app_service_url=$(terraform output -raw app_service_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "key_vault_name=$(terraform output -raw key_vault_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
        working-directory: ./infrastructure
        continue-on-error: true
      
      - name: Post Deployment Summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `## 🚀 Infrastructure Deployment - Dev
            
            **Status:** ${{ steps.apply.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            **Environment:** \`dev\`
            **Committed by:** @${{ github.actor }}
            **Workflow:** ${{ github.workflow }}
            
            ### Resources Deployed:
            - **App Service:** \`${{ steps.outputs.outputs.app_service_name }}\`
            - **App URL:** ${{ steps.outputs.outputs.app_service_url }}
            - **Key Vault:** \`${{ steps.outputs.outputs.key_vault_name }}\`
            
            ### Actions:
            - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [View Infrastructure Code](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/infrastructure)
            `;
            
            core.summary.addRaw(output).write();

  post_deployment_validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: terraform_apply
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      
      - name: Validate App Service Health
        run: |
          echo "Checking App Service health endpoint..."
          APP_URL="${{ needs.terraform_apply.outputs.app_service_url }}"
          
          if [ "$APP_URL" != "N/A" ]; then
            max_attempts=5
            attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts"
              
              response=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
              
              if [ "$response" = "200" ]; then
                echo "✅ Health check passed"
                exit 0
              fi
              
              echo "Health check returned: $response"
              attempt=$((attempt + 1))
              sleep 10
            done
            
            echo "❌ Health check failed after $max_attempts attempts"
            exit 1
          else
            echo "⚠️  App Service URL not available, skipping health check"
          fi
      
      - name: Validate Key Vault Access
        run: |
          echo "Validating Key Vault access..."
          KV_NAME="${{ needs.terraform_apply.outputs.key_vault_name }}"
          
          if [ "$KV_NAME" != "N/A" ]; then
            az keyvault secret list --vault-name "$KV_NAME" --query "[].name" -o tsv
            echo "✅ Key Vault access validated"
          else
            echo "⚠️  Key Vault name not available, skipping validation"
          fi

  notify_deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [terraform_apply, post_deployment_validation]
    if: always()
    
    steps:
      - name: Send Teams Notification
        if: vars.TEAMS_WEBHOOK_URL != ''
        run: |
          STATUS="${{ needs.terraform_apply.result == 'success' && needs.post_deployment_validation.result == 'success' && 'Success' || 'Failed' }}"
          COLOR="${{ needs.terraform_apply.result == 'success' && needs.post_deployment_validation.result == 'success' && 'Good' || 'Attention' }}"
          
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [{
                  "type": "TextBlock",
                  "text": "Infrastructure Deployment - Dev",
                  "weight": "Bolder",
                  "size": "Large"
                }, {
                  "type": "FactSet",
                  "facts": [
                    {"title": "Status", "value": "'"$STATUS"'"},
                    {"title": "Environment", "value": "dev"},
                    {"title": "Deployed by", "value": "${{ github.actor }}"},
                    {"title": "Branch", "value": "${{ github.ref_name }}"}
                  ]
                }],
                "actions": [{
                  "type": "Action.OpenUrl",
                  "title": "View Workflow",
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }]
              }
            }]
          }' ${{ vars.TEAMS_WEBHOOK_URL }}
