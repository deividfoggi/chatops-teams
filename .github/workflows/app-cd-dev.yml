name: Application - Deploy to Dev

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - '.github/workflows/app-cd-dev.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '18'
  AZURE_WEBAPP_NAME: 'chatops-app-service'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/package.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./src
      
      - name: Create deployment package
        run: |
          # Create a clean deployment package
          mkdir -p deployment
          cp -r src/* deployment/ 2>/dev/null || true
          
          # Remove dev dependencies and reinstall for production
          cd deployment
          npm ci --production
          
          # Create zip file for deployment
          zip -r ../deployment.zip .
        working-directory: .
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 1

  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    outputs:
      app_url: ${{ steps.get-details.outputs.app_url }}
      resource_group: ${{ steps.get-details.outputs.resource_group }}
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      
      - name: Get App Service Details
        id: get-details
        run: |
          # Resource group follows naming convention: rg-chatops-{environment}
          RESOURCE_GROUP="rg-chatops-dev"
          
          # Get App Service details
          DETAILS=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group $RESOURCE_GROUP --query '{resourceGroup:resourceGroup,hostName:defaultHostName}' -o json)
          HOST_NAME=$(echo $DETAILS | jq -r '.hostName')
          echo "resource_group=${RESOURCE_GROUP}" >> $GITHUB_OUTPUT
          echo "app_url=https://${HOST_NAME}" >> $GITHUB_OUTPUT
          echo "App Service URL: https://${HOST_NAME}"
          echo "Resource Group: ${RESOURCE_GROUP}"
      
      - name: Deploy to Azure App Service (Flex Consumption via Storage)
        run: |
          # For Flex Consumption plans, deploy via Azure Blob Storage
          # This is the recommended method when SCM endpoint is not available
          echo "Deploying to Flex Consumption App Service: ${{ env.AZURE_WEBAPP_NAME }}"
          
          # Get or create storage account for deployment packages
          STORAGE_ACCOUNT="chatopsdeployments"
          RESOURCE_GROUP="rg-chatops-dev"
          CONTAINER_NAME="deployments"
          
          # Check if storage account exists
          if ! az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP &>/dev/null; then
            echo "Creating storage account for deployments..."
            az storage account create \
              --name $STORAGE_ACCOUNT \
              --resource-group $RESOURCE_GROUP \
              --location eastus2 \
              --sku Standard_LRS \
              --kind StorageV2 \
              --allow-blob-public-access false
          fi
          
          # Create container if it doesn't exist
          az storage container create \
            --name $CONTAINER_NAME \
            --account-name $STORAGE_ACCOUNT \
            --auth-mode login \
            --only-show-errors || true
          
          # Upload deployment package to blob storage
          BLOB_NAME="chatops-app-$(date +%Y%m%d-%H%M%S).zip"
          echo "Uploading deployment package: ${BLOB_NAME}"
          
          az storage blob upload \
            --account-name $STORAGE_ACCOUNT \
            --container-name $CONTAINER_NAME \
            --name $BLOB_NAME \
            --file deployment.zip \
            --auth-mode login \
            --overwrite
          
          # Generate SAS token with 7 days expiry (max for user delegation key)
          EXPIRY=$(date -u -d '+7 days' '+%Y-%m-%dT%H:%MZ' 2>/dev/null || date -u -v +7d '+%Y-%m-%dT%H:%MZ')
          
          SAS_TOKEN=$(az storage blob generate-sas \
            --account-name $STORAGE_ACCOUNT \
            --container-name $CONTAINER_NAME \
            --name $BLOB_NAME \
            --permissions r \
            --expiry $EXPIRY \
            --auth-mode login \
            --as-user \
            -o tsv)
          
          # Construct the blob URL with SAS token
          BLOB_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${CONTAINER_NAME}/${BLOB_NAME}?${SAS_TOKEN}"
          
          # Update App Service to run from the new package
          echo "Configuring App Service to run from package..."
          az webapp config appsettings set \
            --resource-group $RESOURCE_GROUP \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings WEBSITE_RUN_FROM_PACKAGE="$BLOB_URL" \
            --output none
          
          echo "✅ Deployment package uploaded and configured"
          echo "Package URL: https://${STORAGE_ACCOUNT}.blob.core.windows.net/${CONTAINER_NAME}/${BLOB_NAME}"
          
          # Restart the app to pick up the new package
          echo "Restarting App Service..."
          az webapp restart \
            --resource-group $RESOURCE_GROUP \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --output none
          
          echo "✅ Deployment complete. Waiting for app to start..."
          sleep 30

  health_check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    environment: dev
    
    steps:
      - name: Wait for App Startup
        run: sleep 30
      
      - name: Health Check with Retry
        id: health_check
        run: |
          APP_URL="${{ needs.deploy.outputs.app_url }}"
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          
          echo "Starting health check for: ${APP_URL}/health"
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/health" || echo "000")
            
            echo "HTTP Status Code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              SUCCESS=true
              break
            fi
            
            echo "Health check failed with status: $HTTP_CODE"
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ "$SUCCESS" = "false" ]; then
            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi
      
      - name: Post Health Check Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.health_check.outcome }}' === 'success' ? '✅ Healthy' : '❌ Failed';
            const appUrl = '${{ needs.deploy.outputs.app_url }}';
            
            const output = `### 🏥 Health Check Results
            
            **Status:** ${status}
            **Endpoint:** \`${appUrl}/health\`
            **Environment:** \`dev\`
            **Deployed by:** @${{ github.actor }}
            
            ---
            *Workflow: \`${{ github.workflow }}\` | Run: #${{ github.run_number }}*`;
            
            core.summary.addRaw(output).write();

  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy, health_check]
    if: always()
    
    steps:
      - name: Send Teams Notification
        if: vars.TEAMS_WEBHOOK_URL != ''
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          HEALTH_STATUS="${{ needs.health_check.result }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          
          if [ "$DEPLOY_STATUS" = "success" ] && [ "$HEALTH_STATUS" = "success" ]; then
            STATUS="Success"
            STATUS_ICON="✅"
          else
            STATUS="Failed"
            STATUS_ICON="❌"
          fi
          
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [{
                  "type": "TextBlock",
                  "text": "'"$STATUS_ICON"' Application Deployment - Dev",
                  "weight": "Bolder",
                  "size": "Large"
                }, {
                  "type": "FactSet",
                  "facts": [
                    {"title": "Status", "value": "'"$STATUS"'"},
                    {"title": "Environment", "value": "dev"},
                    {"title": "Application", "value": "ChatOps Teams Bot"},
                    {"title": "Deployment", "value": "'"$DEPLOY_STATUS"'"},
                    {"title": "Health Check", "value": "'"$HEALTH_STATUS"'"},
                    {"title": "Deployed by", "value": "${{ github.actor }}"},
                    {"title": "Branch", "value": "${{ github.ref_name }}"},
                    {"title": "Commit", "value": "'"$SHORT_SHA"'"}
                  ]
                }],
                "actions": [{
                  "type": "Action.OpenUrl",
                  "title": "View Workflow",
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }, {
                  "type": "Action.OpenUrl",
                  "title": "View Commit",
                  "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                }]
              }
            }]
          }' ${{ vars.TEAMS_WEBHOOK_URL }}
      
      - name: Deployment Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployStatus = '${{ needs.deploy.result }}' === 'success' ? '✅ Success' : '❌ Failed';
            const healthStatus = '${{ needs.health_check.result }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const commitSha = '${{ github.sha }}'.substring(0, 7);
            
            const output = `## 🚀 Application Deployment - Dev
            
            | Check | Status |
            |-------|--------|
            | Deployment | ${deployStatus} |
            | Health Check | ${healthStatus} |
            
            **Environment:** \`dev\`
            **Application:** \`${{ env.AZURE_WEBAPP_NAME }}\`
            **Deployed by:** @${{ github.actor }}
            **Branch:** \`${{ github.ref_name }}\`
            **Commit:** \`${commitSha}\`
            
            ### Actions:
            - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            `;
            
            core.summary.addRaw(output).write();
