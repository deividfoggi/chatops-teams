name: Application - CI (Pull Request Validation)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'teams-app/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

env:
  NODE_VERSION: '18'

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/package.json
      
      - name: Install dependencies
        run: npm install
        working-directory: ./src
      
      - name: Run linter
        id: lint
        run: npm run lint
        working-directory: ./src
        continue-on-error: true
      
      - name: Run unit tests
        id: test_unit
        run: npm run test:unit
        working-directory: ./src
      
      - name: Run integration tests
        id: test_integration
        run: npm run test:integration
        working-directory: ./src
      
      - name: Run performance tests
        id: test_performance
        run: npm run test:performance
        working-directory: ./src
      
      - name: Run all tests
        id: test_all
        run: npm run test:all
        working-directory: ./src
      
      - name: Generate coverage report
        id: coverage
        run: |
          npm run test:coverage || true
          # Store coverage percentage for reporting
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE_LINES=$(cat coverage/coverage-summary.json | grep -o '"lines":{"total":[0-9]*,"covered":[0-9]*,"skipped":[0-9]*,"pct":[0-9.]*' | grep -o 'pct":[0-9.]*' | cut -d: -f2)
            COVERAGE_FUNCTIONS=$(cat coverage/coverage-summary.json | grep -o '"functions":{"total":[0-9]*,"covered":[0-9]*,"skipped":[0-9]*,"pct":[0-9.]*' | grep -o 'pct":[0-9.]*' | cut -d: -f2 | head -1)
            COVERAGE_BRANCHES=$(cat coverage/coverage-summary.json | grep -o '"branches":{"total":[0-9]*,"covered":[0-9]*,"skipped":[0-9]*,"pct":[0-9.]*' | grep -o 'pct":[0-9.]*' | cut -d: -f2 | head -1)
            echo "COVERAGE_LINES=${COVERAGE_LINES:-0}" >> $GITHUB_ENV
            echo "COVERAGE_FUNCTIONS=${COVERAGE_FUNCTIONS:-0}" >> $GITHUB_ENV
            echo "COVERAGE_BRANCHES=${COVERAGE_BRANCHES:-0}" >> $GITHUB_ENV
          else
            echo "COVERAGE_LINES=0" >> $GITHUB_ENV
            echo "COVERAGE_FUNCTIONS=0" >> $GITHUB_ENV
            echo "COVERAGE_BRANCHES=0" >> $GITHUB_ENV
          fi
        working-directory: ./src
        continue-on-error: true
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            src/coverage/lcov.info
            src/coverage/coverage-summary.json
          retention-days: 30
      
      - name: Post Lint Results
        if: steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Linting Issues Detected**\n\nPlease run `npm run lint` in the `src/` directory and fix any linting issues.'
            })
      
      - name: Post Test Results with Coverage
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testUnitStatus = '${{ steps.test_unit.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const testIntegrationStatus = '${{ steps.test_integration.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const testPerformanceStatus = '${{ steps.test_performance.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const testAllStatus = '${{ steps.test_all.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const lintStatus = '${{ steps.lint.outcome }}' === 'success' ? '✅ Passed' : '⚠️ Issues';
            
            // Coverage data
            const coverageLines = '${{ env.COVERAGE_LINES }}' || '0';
            const coverageFunctions = '${{ env.COVERAGE_FUNCTIONS }}' || '0';
            const coverageBranches = '${{ env.COVERAGE_BRANCHES }}' || '0';
            
            const coverageIcon = parseFloat(coverageLines) >= 80 ? '✅' : '⚠️';
            const coverageStatus = `${coverageIcon} Lines: ${coverageLines}% | Functions: ${coverageFunctions}% | Branches: ${coverageBranches}%`;
            
            let output = `## 🧪 Test Results & Coverage
            
### Test Execution

| Test Type | Status |
|-----------|--------|
| Linting | ${lintStatus} |
| Unit Tests | ${testUnitStatus} |
| Integration Tests | ${testIntegrationStatus} |
| Performance Tests | ${testPerformanceStatus} |
| All Tests | ${testAllStatus} |

### Code Coverage

${coverageStatus}

**Target:** 80% coverage for lines, functions, and branches

`;

            // Add test failure details if any failed
            if (testAllStatus.includes('Failed')) {
              output += `\n⚠️ **Action Required**: Some tests failed. Please review the logs for details and stack traces.\n`;
            }
            
            if (parseFloat(coverageLines) < 80) {
              output += `\n📊 **Coverage Info**: Current coverage is below 80% threshold. This is informational and will be improved in future stories.\n`;
            }
            
            output += `\n---\n*Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })


  codeql_analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: build_and_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
      
      - name: Post CodeQL Results
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 **Security Issues Detected by CodeQL**\n\nCodeQL found potential security issues in the JavaScript code. Please check the Security tab for details.'
            })

  dependency_scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build_and_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm install
        working-directory: ./src
      
      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > audit-results.json || true
          npm audit
        working-directory: ./src
        continue-on-error: true
      
      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: src/audit-results.json
          retention-days: 30
      
      - name: Post Audit Results
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Dependency Vulnerabilities Detected**\n\nnpm audit found vulnerabilities in dependencies. Please review the audit results and update vulnerable packages.'
            })

  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: build_and_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Trivy Secret Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secret-results.sarif'
          exit-code: '0'
      
      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-secret-results.sarif'
          category: 'trivy-secrets'
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.63.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail
        continue-on-error: true
      
      - name: Post Secret Scan Results
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔐 **Secrets Detected in Code**\n\nSecret scanning detected potential secrets or sensitive data in the code. Please review and remove any exposed credentials immediately.'
            })

  validation_summary:
    name: CI Validation Summary
    runs-on: ubuntu-latest
    needs: [build_and_test, codeql_analysis, dependency_scan, secret_scan]
    if: always()
    
    steps:
      - name: Check Results
        run: |
          echo "Build and Test: ${{ needs.build_and_test.result }}"
          echo "CodeQL Analysis: ${{ needs.codeql_analysis.result }}"
          echo "Dependency Scan: ${{ needs.dependency_scan.result }}"
          echo "Secret Scan: ${{ needs.secret_scan.result }}"
          
          # Build and test must succeed
          if [ "${{ needs.build_and_test.result }}" != "success" ]; then
            echo "❌ Build and test failed"
            exit 1
          fi
          
          # Security scans are required - fail if any critical security check fails
          if [ "${{ needs.codeql_analysis.result }}" == "failure" ]; then
            echo "❌ CodeQL analysis failed"
            exit 1
          fi
          
          # Dependency and secret scans can have warnings but shouldn't fail hard
          if [ "${{ needs.dependency_scan.result }}" != "success" ]; then
            echo "⚠️ Dependency scan had issues (non-blocking)"
          fi
          
          if [ "${{ needs.secret_scan.result }}" != "success" ]; then
            echo "⚠️ Secret scan had issues (non-blocking)"
          fi
          
          echo "✅ Required validation checks passed"
      
      - name: Post Summary
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ needs.build_and_test.result }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const codeqlStatus = '${{ needs.codeql_analysis.result }}' === 'success' ? '✅ Passed' : '⚠️ Issues';
            const depsStatus = '${{ needs.dependency_scan.result }}' === 'success' ? '✅ Passed' : '⚠️ Issues';
            const secretsStatus = '${{ needs.secret_scan.result }}' === 'success' ? '✅ Passed' : '⚠️ Issues';
            
            const output = `## 🔍 CI Validation Summary
            
            | Check Category | Status |
            |---------------|--------|
            | Build & Tests | ${buildStatus} |
            | CodeQL Security | ${codeqlStatus} |
            | Dependencies | ${depsStatus} |
            | Secrets | ${secretsStatus} |
            
            ${buildStatus.includes('Failed') ? '\n⚠️ **Action Required**: Build or tests failed. Please review the logs above.' : ''}
            ${!codeqlStatus.includes('Passed') || !depsStatus.includes('Passed') || !secretsStatus.includes('Passed') ? '\n⚠️ **Security Review Needed**: Review security scan results in the Security tab.' : ''}
            
            ---
            *Workflow: \`${{ github.workflow }}\` | Run: #${{ github.run_number }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
